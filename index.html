<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10111b">
<meta name="description" content="AnimeVerse — discover anime and track your watchlist.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>AnimeVerse</title>
<style>
:root{color-scheme:dark;--bg:#10111b;--panel:#1d1e2d;--panel2:#25263a;--muted:#aaaac1;--text:#f7f5ff;--purple:#8b5cf6;--purple2:#6d3fd1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#211a3c 0,#10111b 48%);font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--purple);color:white;font-weight:650}button.secondary{background:#303146;color:#eee}button.ghost{background:transparent;border:1px solid #45445e;color:#eee}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #c4b5fd;outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:#10111beF;backdrop-filter:blur(16px);border-bottom:1px solid #ffffff12;padding:12px max(16px,calc((100vw - 1050px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px;letter-spacing:-.5px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#a78bfa,#6d28d9);display:grid;place-items:center}
nav{display:flex;gap:5px;flex-wrap:wrap}nav button{background:transparent;color:var(--muted);padding:9px 11px}nav button.active{background:#7545ce;color:white}
main{max-width:1050px;margin:auto;padding:24px 16px 90px}.hero{border-radius:24px;padding:clamp(24px,5vw,48px);background:linear-gradient(110deg,#211b3c,#34215a 55%,#171a31);position:relative;overflow:hidden;min-height:220px;display:flex;align-items:center}.hero:after{content:"✦";position:absolute;right:7%;top:-65px;font-size:260px;color:#ffffff0c}.hero-content{position:relative;z-index:1;max-width:570px}.eyebrow{color:#c4b5fd;text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800}.hero h1{font-size:clamp(32px,6vw,52px);line-height:1.05;margin:10px 0}.sub{color:#c5c3d7;line-height:1.55}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:28px 0 14px}.section-head h2{margin:0;font-size:21px}.muted{color:var(--muted)}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.tools input,.tools select{background:#202133;border:1px solid #38394f;color:white;border-radius:12px;padding:11px 13px;min-width:0}.tools input{flex:1;min-width:170px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}.card{background:var(--panel);border:1px solid #ffffff0c;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .16s,border .16s}.card:hover{transform:translateY(-3px);border-color:#8b5cf688}.poster{height:180px;display:flex;align-items:end;padding:12px;background:linear-gradient(145deg,var(--c1),var(--c2));position:relative;overflow:hidden}.poster:before{content:"";position:absolute;width:170px;height:170px;border:1px solid #ffffff30;border-radius:50%;right:-45px;top:-45px;box-shadow:0 0 0 18px #ffffff0a,0 0 0 38px #ffffff08}.poster .symbol{font-size:66px;position:absolute;right:12px;top:20px;opacity:.65}.poster .poster-title{position:relative;font-weight:850;font-size:18px;text-shadow:0 2px 8px #0008;max-width:90%}.card-info{padding:11px}.card-info strong{display:block;line-height:1.3}.meta{font-size:12px;color:var(--muted);margin-top:5px}.pill{display:inline-block;background:#7545ce33;color:#d8c7ff;border:1px solid #8b5cf644;border-radius:99px;padding:3px 8px;font-size:11px;margin-top:8px}
.empty{padding:30px;text-align:center;border:1px dashed #45445e;border-radius:16px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid #ffffff12;border-radius:18px;padding:18px;margin-top:18px}.detail-top{display:grid;grid-template-columns:190px 1fr;gap:20px}.detail-poster{min-height:240px;border-radius:16px;background:linear-gradient(145deg,#5b3c9e,#192c4a);display:grid;place-items:center;font-size:75px}.detail h1{margin:5px 0 8px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.progress{height:9px;background:#38394d;border-radius:99px;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#c4b5fd);border-radius:99px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:var(--panel2);padding:17px;border-radius:14px}.stat b{font-size:26px;display:block}.stat small{color:var(--muted)}
footer{text-align:center;color:#77778f;font-size:12px;padding:24px}
.modal-back{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:18px;z-index:10}.modal-back.show{display:grid}.modal{background:#202133;border:1px solid #ffffff20;border-radius:18px;padding:20px;max-width:430px;width:100%;box-shadow:0 20px 80px #0008}.modal h3{margin-top:0}.modal select{width:100%;padding:11px;background:#303146;color:white;border:1px solid #555;border-radius:10px;margin:8px 0 16px}
@media(max-width:600px){header{align-items:flex-start;flex-direction:column}nav{width:100%;display:grid;grid-template-columns:repeat(4,1fr)}nav button{padding:8px 4px;font-size:12px}.detail-top{grid-template-columns:1fr}.detail-poster{min-height:155px}.poster{height:155px}.stats{grid-template-columns:1fr 1fr}.hero{min-height:205px}}
</style>
</head>
<body>
<header>
 <div class="brand"><span class="logo">▶</span> AnimeVerse</div>
 <nav aria-label="Main navigation">
  <button class="active" data-tab="Home">Home</button><button data-tab="Discover">Discover</button><button data-tab="My List">My List</button><button data-tab="Profile">Profile</button>
 </nav>
</header>
<main id="app" aria-live="polite"></main>
<footer>ANIMEVERSE · A fan-made anime discovery & tracking prototype</footer>
<div class="modal-back" id="modal"><div class="modal"><h3>Update anime status</h3><label for="statusSelect">Your status</label><select id="statusSelect"><option>Watching</option><option>Completed</option><option>Planned</option><option>Dropped</option></select><div class="row"><button id="saveStatus">Save</button><button class="secondary" id="closeModal">Cancel</button></div></div></div>
<script>
const shows=[
 {id:1,title:"Attack on Titan",year:2013,genre:"Action",rating:"9.1",episodes:87,symbol:"⚔",c1:"#713b83",c2:"#203b57",desc:"Humanity fights for survival behind enormous walls."},
 {id:2,title:"Fullmetal Alchemist: Brotherhood",year:2009,genre:"Adventure",rating:"9.1",episodes:64,symbol:"✧",c1:"#a65a37",c2:"#44305c",desc:"Two brothers search for the Philosopher's Stone."},
 {id:3,title:"Demon Slayer",year:2019,genre:"Action",rating:"8.6",episodes:63,symbol:"刀",c1:"#286b68",c2:"#263a72",desc:"A young swordsman fights demons to save his sister."},
 {id:4,title:"Death Note",year:2006,genre:"Thriller",rating:"8.9",episodes:37,symbol:"☠",c1:"#343448",c2:"#171722",desc:"A mysterious notebook changes the life of a student."},
 {id:5,title:"Jujutsu Kaisen",year:2020,genre:"Action",rating:"8.5",episodes:47,symbol:"呪",c1:"#5c3d82",c2:"#25264b",desc:"A student enters the world of cursed spirits."},
 {id:6,title:"Steins;Gate",year:2011,genre:"Sci-Fi",rating:"9.0",episodes:24,symbol:"⌁",c1:"#277b80",c2:"#24345c",desc:"A group of friends discover the consequences of time travel."},
 {id:7,title:"Spy x Family",year:2022,genre:"Comedy",rating:"8.4",episodes:37,symbol:"✿",c1:"#4c8c76",c2:"#26365e",desc:"A spy builds an unusual family for a secret mission."},
 {id:8,title:"Haikyu!!",year:2014,genre:"Sports",rating:"8.7",episodes:85,symbol:"🏐",c1:"#c06a35",c2:"#563b6c",desc:"A determined volleyball player chases his dream."}
];
const defaults={1:"Watching",2:"Completed",3:"Watching",4:"Planned",5:"Planned",6:"Completed"};
let data=JSON.parse(localStorage.getItem("animeverse-data")||"null")||{statuses:defaults,progress:{},saved:[1,2,3,4,5,6]};
let tab="Home",query="",genre="All",selected=1,modalId=null;
function persist(){localStorage.setItem("animeverse-data",JSON.stringify(data))}
function countStatus(s){return Object.values(data.statuses).filter(x=>x===s).length}
function card(a){let p=data.progress[a.id]||0;return `<article class="card" data-open="${a.id}"><div class="poster" style="--c1:${a.c1};--c2:${a.c2}"><span class="symbol">${a.symbol}</span><span class="poster-title">${a.title}</span></div><div class="card-info"><strong>${a.title}</strong><div class="meta">${a.year} · ${a.genre} · ★ ${a.rating}</div><span class="pill">${data.statuses[a.id]||"Not added"}${p?` · ${p}/${a.episodes}`:""}</span></div></article>`}
function filtered(){return shows.filter(a=>(tab!=="My List"||data.saved.includes(a.id))&&a.title.toLowerCase().includes(query.toLowerCase())&&(genre==="All"||a.genre===genre))}
function toolbar(){return `<div class="tools"><input id="search" placeholder="Search anime..." value="${escapeHtml(query)}"><select id="genre"><option>All</option>${["Action","Adventure","Thriller","Sci-Fi","Comedy","Sports"].map(g=>`<option ${genre===g?"selected":""}>${g}</option>`).join("")}</select></div>`}
function listPage(){let items=filtered();return `${tab==="Home"?`<section class="hero"><div class="hero-content"><div class="eyebrow">Your anime universe</div><h1>Find your next<br>favourite anime.</h1><p class="sub">Discover shows, build your watchlist and keep track of every episode.</p><button onclick="go('Discover')">Explore anime →</button></div></section><div class="section-head"><h2>Popular picks</h2><span class="muted">${items.length} titles</span></div>`:`<div class="section-head"><div><h2>${tab==="Discover"?"Discover Anime":"My List"}</h2><span class="muted">${tab==="Discover"?"Search the sample catalogue":"Your saved collection"}</span></div></div>`}${toolbar()}<div class="grid">${items.map(card).join("")}</div>${items.length?"":'<div class="empty">No anime found. Try another search or genre.</div>'}`}
function detailPage(){let a=shows.find(x=>x.id===selected),p=data.progress[a.id]||0,added=data.saved.includes(a.id);return `<button class="ghost" onclick="go('Discover')">← Back to anime</button><section class="panel detail"><div class="detail-top"><div class="detail-poster" style="background:linear-gradient(145deg,${a.c1},${a.c2})">${a.symbol}</div><div><div class="eyebrow">${a.genre} · ${a.year}</div><h1>${a.title}</h1><p class="sub">${a.desc}</p><p>★ <b>${a.rating}</b> <span class="muted">· ${a.episodes} episodes</span></p><div class="row"><button onclick="toggleSave(${a.id})">${added?"✓ In My List":"＋ Add to My List"}</button><button class="secondary" onclick="openModal(${a.id})">Change status</button></div></div></div><div class="section-head"><h2>Episode progress</h2><b>${p} / ${a.episodes}</b></div><div class="progress"><span style="width:${p/a.episodes*100}%"></span></div><div class="row between"><span class="muted">Episodes watched</span><div class="row"><button class="secondary" onclick="stepProgress(${a.id},-1)">−</button><button onclick="stepProgress(${a.id},1)">＋ Watched episode</button></div></div><p class="muted" style="font-size:12px">This prototype tracks episodes; it does not host or play video streams.</p></section>`}
function profilePage(){return `<div class="section-head"><div><h2>Your Profile</h2><span class="muted">Your anime activity at a glance</span></div></div><section class="panel"><div class="stats"><div class="stat"><b>${data.saved.length}</b><small>In collection</small></div><div class="stat"><b>${countStatus("Completed")}</b><small>Completed</small></div><div class="stat"><b>${Object.values(data.progress).reduce((x,y)=>x+y,0)}</b><small>Episodes tracked</small></div></div><div class="section-head"><h2>By status</h2></div>${["Watching","Planned","Completed","Dropped"].map(s=>`<div class="row between" style="padding:9px 0;border-bottom:1px solid #ffffff12"><span>${s}</span><b>${countStatus(s)}</b></div>`).join("")}</section><p class="muted" style="font-size:12px">Your list and progress are saved in this browser on this device.</p>`}
function render(){let app=document.getElementById("app");app.innerHTML=tab==="Details"?detailPage():tab==="Profile"?profilePage():listPage();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));let s=document.getElementById("search");if(s)s.addEventListener("input",e=>{query=e.target.value;let pos=e.target.selectionStart;render();let n=document.getElementById("search");n.focus();n.setSelectionRange(pos,pos)});let g=document.getElementById("genre");if(g)g.addEventListener("change",e=>{genre=e.target.value;render()});document.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click",()=>{selected=Number(el.dataset.open);go("Details")}))}
function go(t){tab=t;query="";genre="All";render();window.scrollTo(0,0)}
function toggleSave(id){if(data.saved.includes(id))data.saved=data.saved.filter(x=>x!==id);else data.saved.push(id);persist();render()}
function stepProgress(id,n){let a=shows.find(x=>x.id===id);data.progress[id]=Math.max(0,Math.min(a.episodes,(data.progress[id]||0)+n));persist();render()}
function openModal(id){modalId=id;document.getElementById("statusSelect").value=data.statuses[id]||"Planned";document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.tab)));
document.getElementById("closeModal").onclick=closeModal;
document.getElementById("saveStatus").onclick=()=>{data.statuses[modalId]=document.getElementById("statusSelect").value;if(!data.saved.includes(modalId))data.saved.push(modalId);persist();closeModal();render()};
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();
</script>
</body></html>
